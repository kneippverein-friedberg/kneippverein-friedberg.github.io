- title: "Weihnachtsfeier 2026"
  date: ""
  image: /assets/images/news/weihnachten2026.jpg
  image_copyright: "Bildnachweis: pixabay"
  text: "Liebe Mitglieder des Kneippvereins, die kalte Jahreszeit ist Kneipp-Zeit - aber zur Weihnachtsfeier darf es diesmal auch ohne kaltes Wasser gemütlich werden. Wir laden herzlich ein zu einem besinnlichen Nachmittag bei Glühwein, Plätzchen und guten Gesprächen. Die Feier findet am 12.12.26 ab 15 Uhr im Divano in Friedberg, Pfarrstraße 1 statt. Wir bitten um Anmeldung bis zum 30.11.2026 im KneippTreff, telefonisch oder per Mail. Wir freuen uns auf ein fröhlichen Ausklang des Vereinsjahres mit euch. Herzliche Grüße, euer Vorstand."

